name: Fetch, validate, and compute

# Runs entirely on GitHub's servers, so nothing needs to be installed locally.
# Start it by hand: Actions tab > "Fetch, validate, and compute" > Run workflow.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to fetch, separated by spaces"
        default: "2023 2024 2025 2026"
      skip_existing:
        description: "Skip seasons that already have a data file"
        type: boolean
        default: true

# Lets the job save the fetched data back into the repository.
permissions:
  contents: write

# Never run two data updates at the same time.
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Fetch data
        shell: bash
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          SEASONS: ${{ inputs.seasons }}
          SKIP_EXISTING: ${{ inputs.skip_existing }}
        run: |
          if [ -z "$BALLDONTLIE_API_KEY" ]; then
            echo "The BALLDONTLIE_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if ! [[ "$SEASONS" =~ ^[0-9]{4}( [0-9]{4})*$ ]]; then
            echo "Seasons must be four-digit years separated by single spaces, for example: 2025 2026"
            exit 1
          fi
          ARGS="--seasons $SEASONS"
          if [ "$SKIP_EXISTING" = "true" ]; then
            ARGS="$ARGS --skip-existing"
          fi
          python pipeline/fetch.py $ARGS

      - name: Validate data
        id: validate
        shell: bash
        continue-on-error: true
        run: |
          python pipeline/validate.py | tee data/validation_report.txt

      - name: Show validation results on the run page
        if: always()
        shell: bash
        run: |
          {
            echo "## Validation results"
            echo '```'
            cat data/validation_report.txt 2>/dev/null || echo "No report was produced."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compute standings, expected records, and Elo
        id: compute
        if: steps.validate.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          python pipeline/compute.py | tee data/compute_report.txt

      - name: Show compute results on the run page
        if: steps.validate.outcome == 'success'
        shell: bash
        run: |
          {
            echo "## Compute results"
            echo '```'
            cat data/compute_report.txt 2>/dev/null || echo "No report was produced."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save data to the repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main

          git add data
          if git diff --cached --quiet; then
            echo "No new data to save."
          else
            git commit -m "Update raw data"
            git push origin HEAD:main
          fi

      - name: Fail the run if validation or computing found problems
        if: steps.validate.outcome == 'failure' || steps.compute.outcome == 'failure'
        shell: bash
        run: |
          echo "Validation or computing found problems. The data was saved so you can inspect it, but do not build on it yet."
          exit 1
