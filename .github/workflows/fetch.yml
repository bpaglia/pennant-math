name: Fetch, validate, and compute

# Runs entirely on GitHub's servers, so nothing needs to be installed locally.
# It also runs by itself every day at 10:00 UTC (6 AM Eastern in summer, 5 AM in winter).
# Start it by hand: Actions tab > "Fetch, validate, and compute" > Run workflow.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to fetch, separated by spaces"
        default: "2023 2024 2025 2026"
      skip_existing:
        description: "Skip seasons that already have a data file"
        type: boolean
        default: true
      run_backtest:
        description: "Also replay past seasons to score the playoff-odds model (a few extra minutes)"
        type: boolean
        default: false
      tune_noise:
        description: "Also try several rating-uncertainty levels and compare them (several extra minutes)"
        type: boolean
        default: false

# Lets the job save the fetched data back into the repository.
permissions:
  contents: write

# Never run two data updates at the same time.
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Fetch data
        shell: bash
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          SEASONS: ${{ inputs.seasons }}
          SKIP_EXISTING: ${{ inputs.skip_existing }}
        run: |
          if [ -z "$BALLDONTLIE_API_KEY" ]; then
            echo "The BALLDONTLIE_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Scheduled runs have no inputs: refresh just the current season.
          if [ -z "$SEASONS" ]; then
            SEASONS="$(date -u +%Y)"
          fi
          if ! [[ "$SEASONS" =~ ^[0-9]{4}( [0-9]{4})*$ ]]; then
            echo "Seasons must be four-digit years separated by single spaces, for example: 2025 2026"
            exit 1
          fi
          ARGS="--seasons $SEASONS"
          if [ "$SKIP_EXISTING" = "true" ]; then
            ARGS="$ARGS --skip-existing"
          fi
          python pipeline/fetch.py $ARGS

      - name: Validate data
        id: validate
        shell: bash
        continue-on-error: true
        run: |
          python pipeline/validate.py | tee data/validation_report.txt

      - name: Show validation results on the run page
        if: always()
        shell: bash
        run: |
          {
            echo "## Validation results"
            echo '```'
            cat data/validation_report.txt 2>/dev/null || echo "No report was produced."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compute standings, expected records, and Elo
        id: compute
        if: steps.validate.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          python pipeline/compute.py | tee data/compute_report.txt

      - name: Show compute results on the run page
        if: steps.validate.outcome == 'success'
        shell: bash
        run: |
          {
            echo "## Compute results"
            echo '```'
            cat data/compute_report.txt 2>/dev/null || echo "No report was produced."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Playoff odds
        id: odds
        if: steps.compute.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          python pipeline/odds.py | tee data/odds_report.txt

      - name: Backtest the playoff-odds model
        id: backtest
        if: steps.compute.outcome == 'success' && inputs.run_backtest
        shell: bash
        continue-on-error: true
        env:
          SEASONS: ${{ inputs.seasons }}
        run: |
          python pipeline/odds.py --backtest $SEASONS --sims 2000 --step-days 7 | tee data/backtest_report.txt

      - name: Tune rating uncertainty
        id: tuning
        if: steps.compute.outcome == 'success' && inputs.tune_noise
        shell: bash
        continue-on-error: true
        env:
          SEASONS: ${{ inputs.seasons }}
        run: |
          python pipeline/odds.py --tune-noise 0 10 20 30 40 50 --backtest $SEASONS --sims 1000 --step-days 14 | tee data/noise_tuning_report.txt

      - name: Pennant Score
        id: score
        if: steps.compute.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          python pipeline/score.py | tee data/score_report.txt

      - name: Daily recap
        id: recap
        if: steps.compute.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          python pipeline/recap.py | tee data/recap_report.txt

      - name: Show odds results on the run page
        if: steps.compute.outcome == 'success'
        shell: bash
        run: |
          {
            echo "## Playoff odds"
            echo '```'
            cat data/odds_report.txt 2>/dev/null || echo "No report was produced."
            echo '```'
            if [ -f data/backtest_report.txt ] && [ "${{ inputs.run_backtest }}" = "true" ]; then
              echo "## Backtest"
              echo '```'
              cat data/backtest_report.txt
              echo '```'
            fi
            if [ -f data/noise_tuning_report.txt ] && [ "${{ inputs.tune_noise }}" = "true" ]; then
              echo "## Rating uncertainty tuning"
              echo '```'
              cat data/noise_tuning_report.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Copy data for the website
        if: steps.compute.outcome == 'success'
        shell: bash
        run: |
          mkdir -p docs/data
          cp data/processed/*.json docs/data/

      - name: Save data to the repository
        if: steps.validate.outcome == 'success' && steps.compute.outcome == 'success' && steps.odds.outcome == 'success' && steps.score.outcome == 'success' && steps.recap.outcome == 'success' && steps.backtest.outcome != 'failure' && steps.tuning.outcome != 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No new data to save."
          else
            git commit -m "Update raw data"
            git push
          fi

      - name: Keep the files from a failed run for inspection
        if: steps.validate.outcome == 'failure' || steps.compute.outcome == 'failure' || steps.odds.outcome == 'failure' || steps.score.outcome == 'failure' || steps.recap.outcome == 'failure' || steps.backtest.outcome == 'failure' || steps.tuning.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failed-run-data
          path: data
          retention-days: 7

      - name: Fail the run if validation or computing found problems
        if: steps.validate.outcome == 'failure' || steps.compute.outcome == 'failure' || steps.odds.outcome == 'failure' || steps.backtest.outcome == 'failure' || steps.tuning.outcome == 'failure' || steps.score.outcome == 'failure' || steps.recap.outcome == 'failure'
        shell: bash
        run: |
          echo "Validation or computing found problems. Nothing was published and the site still shows the last good data. The files from this run are attached to the run page as failed-run-data for 7 days."
          exit 1

